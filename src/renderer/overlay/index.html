<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>PhoneFolder Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <div id="dim"></div>
  <section id="panel" class="panel">
    <header class="head">
      <div class="eyebrow" id="eyebrow">文件夹</div>
      <h1 class="title" id="title">文件夹</h1>
    </header>
    <div class="grid" id="grid"></div>
    <div class="dots" id="dots"></div>
  </section>
  <div id="drop-hint" class="drop-hint">
    <span class="drop-hint-icon">📥</span>
    <span>松手移入「<b id="drop-folder">文件夹</b>」</span>
  </div>
  <div id="toast" class="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
